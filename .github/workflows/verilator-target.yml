name: Verilator target

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
      parts:
        default: 1
        type: number
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      parts:
        default: 1
        type: number

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/verilator-build.yml
    with:
      target: ${{ inputs.target }}
  run:
    needs: build
    uses: ./.github/workflows/verilator-run.yml
    with:
      target: ${{ inputs.target }}
      parts: ${{ inputs.parts }}
