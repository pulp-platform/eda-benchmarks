name: Validate dev branch

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: dev-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchains:
    if: contains(github.event.head_commit.message, '[ci:toolchains]')
    uses: ./.github/workflows/toolchains.yml
  package:
    if: contains(github.event.head_commit.message, '[ci:package]')
    uses: ./.github/workflows/package.yml
  verilator:
    if: contains(github.event.head_commit.message, '[ci:verilator]')
    uses: ./.github/workflows/verilator.yml
