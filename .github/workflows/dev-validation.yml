name: Validate dev branch

on:
  workflow_dispatch:
    inputs:
      toolchains:
        description: Build toolchains
        type: boolean
        default: false
      package:
        description: Generate benchmark package
        type: boolean
        default: false
      verilator:
        description: Build and run Verilator tests
        type: boolean
        default: true
      yosys:
        description: Run Yosys synthesis tests
        type: boolean
        default: false
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: dev-validation-${{ github.ref }}${{ contains(github.event.head_commit.message, '[ci:ara-llvm]') && '-ara-llvm' || '' }}
  cancel-in-progress: true

jobs:
  toolchains:
    if: inputs.toolchains || contains(github.event.head_commit.message, '[ci:toolchains]') || contains(github.event.head_commit.message, '[ci:ara-llvm]')
    uses: ./.github/workflows/toolchains.yml
    with:
      toolchain: ${{ contains(github.event.head_commit.message, '[ci:ara-llvm]') && 'ara-llvm' || 'all' }}
  package:
    if: inputs.package || contains(github.event.head_commit.message, '[ci:package]')
    uses: ./.github/workflows/package.yml
  verilator:
    needs: package
    if: >-
      ${{ !cancelled() && (inputs.verilator || contains(github.event.head_commit.message, '[ci:verilator]')) &&
          (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    uses: ./.github/workflows/verilator.yml
  yosys:
    needs: package
    if: >-
      ${{ !cancelled() && (inputs.yosys || contains(github.event.head_commit.message, '[ci:yosys]')) &&
          (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    uses: ./.github/workflows/yosys.yml
