name: Validate dev branch

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: dev-validation-${{ github.ref }}${{ contains(github.event.head_commit.message, '[ci:ara-llvm]') && '-ara-llvm' || '' }}
  cancel-in-progress: true

jobs:
  toolchains:
    if: contains(github.event.head_commit.message, '[ci:toolchains]') || contains(github.event.head_commit.message, '[ci:ara-llvm]')
    uses: ./.github/workflows/toolchains.yml
    with:
      toolchain: ${{ contains(github.event.head_commit.message, '[ci:ara-llvm]') && 'ara-llvm' || 'all' }}
  package:
    if: contains(github.event.head_commit.message, '[ci:package]')
    uses: ./.github/workflows/package.yml
  verilator:
    needs: package
    if: >-
      ${{ !cancelled() && contains(github.event.head_commit.message, '[ci:verilator]') &&
          (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    uses: ./.github/workflows/verilator.yml
