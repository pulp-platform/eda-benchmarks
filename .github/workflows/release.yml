name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish tested candidate
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ $VERSION != "v$version" ]]; then
            printf 'Release tag %s does not match VERSION (%s).\n' "$VERSION" "$version" >&2
            exit 1
          fi
          [[ $(gh release view "$VERSION" --json isDraft --jq '.isDraft') == true ]]
          gh release download "$VERSION" --pattern source-tree.txt --dir "$RUNNER_TEMP/candidate"
          if [[ $(cat "$RUNNER_TEMP/candidate/source-tree.txt") != "$(git rev-parse HEAD^{tree})" ]]; then
            printf 'Release tag %s differs from the tested candidate. Prepare and test a new candidate.\n' "$VERSION" >&2
            exit 1
          fi
          gh release view "$VERSION" --json assets --jq '.assets[].name' \
            | grep -Fx "pulp-benchmarks-${VERSION}.tar.gz"
          gh release view "$VERSION" --json assets --jq '.assets[].name' \
            | grep -Fx "pulp-benchmarks-${VERSION}-simulation.tar.gz"
          gh release edit "$VERSION" --target "$GITHUB_SHA" --draft=false
          gh release delete-asset "$VERSION" source-tree.txt --yes
