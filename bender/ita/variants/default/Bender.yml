      - main/src/ita_requantizer.sv
      - main/src/ita_serdiv.sv
      - main/src/ita_softmax.sv
      - main/src/ita_softmax_top.sv
      - main/src/ita_sumdotp.sv
      - main/src/ita_weight_controller.sv
      - main/src/ita.sv
