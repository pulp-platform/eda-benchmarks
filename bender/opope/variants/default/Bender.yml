package:
  name: pulp_benchmark_opope
  authors:
    - "Philippe Sauter <phsauter@iis.ee.ethz.ch>"
    - "Yukio Miyasaka <ymiyasaka@iis.ee.ethz.ch>"

dependencies:
  cv32e40p: { git: "https://github.com/pulp-platform/cv32e40p.git", rev: "pulpissimo-v4.1.0" }
  hwpe-stream: { git: "https://github.com/pulp-platform/hwpe-stream.git", version: 1.7 }
  hwpe-ctrl: { git: "https://github.com/pulp-platform/hwpe-ctrl.git", rev: v2.1.0 }
  hci: { git: "https://github.com/pulp-platform/hci.git", rev: v2.1.2 }
  fpnew: { git: "https://github.com/pulp-platform/cvfpu.git", rev: "pulp-v0.1.3" }
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git", version: 1.21.0 }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.11 }

sources:
  - target: any(synthesis, simulation)
    include_dirs:
      - main/rtl
    files:
      - main/rtl/opope_pkg.sv
      - main/rtl/opope_accumulator.sv
      - main/rtl/opope_sdotp.sv
      - main/rtl/opope_sdotp_wrapper.sv
      - main/rtl/opope_fma.sv
      - main/rtl/opope_ce.sv
      - main/rtl/opope_fpnew.sv
      - main/rtl/opope_seq_mult.sv
      - main/rtl/opope_engine.sv
      - main/rtl/opope_tiler.sv
      - main/rtl/opope_ctrl.sv
      - main/rtl/opope_streamer.sv
      - main/rtl/opope_buffers.sv
      - main/rtl/opope_top.sv
      - main/rtl/opope_wrap.sv

  - target: simulation
    files:
      - main/target/sim/src/tb_dummy_memory.sv
      - main/target/sim/src/opope_tb.sv
